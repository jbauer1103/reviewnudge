# Settings for Supabase server functions (also set in the Supabase dashboard).

# find-business checks the login itself (withSupabase auth: "user").
[functions.find-business]
verify_jwt = false

# review-count checks the login itself too.
[functions.review-count]
verify_jwt = false

# delete-account checks the login itself too.
[functions.delete-account]
verify_jwt = false

# send-follow-ups is called every hour by the database (pg_cron) with the publishable key.
[functions.send-follow-ups]
verify_jwt = false

# create-checkout and billing-portal check the login themselves.
[functions.create-checkout]
verify_jwt = false

[functions.billing-portal]
verify_jwt = false

# stripe-webhook is called by Stripe, and checks Stripe's signature itself.
[functions.stripe-webhook]
verify_jwt = false
